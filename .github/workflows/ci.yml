# FeatureLink Suite — component build / lint / test matrix.
#
# Closes C-13 (CRITICAL) and carries the enforcement half of C-15, C-29 and C-30.
#
# WHAT WAS WRONG BEFORE
# ---------------------
# Four workflow files existed at ATAK5.6/workflows/{build,release}.yml and
# ATAK5.7/workflows/{build,release}.yml. GitHub Actions only discovers workflows in
# .github/workflows/ AT THE REPOSITORY ROOT, and .github/ did not exist. Those four files
# had never executed and could not execute. The repository appeared to have CI and had
# none: every one of the nine released artifacts came from an unverified local build on a
# developer workstation.
#
# They would also have failed immediately if simply relocated:
#   * build.yml:66 wrote `sdk.path` into local.properties, but ATAK5.6/app/build.gradle:44
#     reads `atak.sdk.path`. main.jar would never have reached the compile classpath.
#   * every path in them assumed the repository root WAS the ATAK project root
#     (buildtools/, gradlew, app/build/outputs/...), which in this monorepo is ATAK5.6/.
#
# Both are fixed here. See .github/workflows/release.yml for the two Actions script
# injections that were in the old release.yml.
#
# ACTION PINNING
# --------------
# Every third-party action is pinned by 40-character commit SHA, never by tag. A tag is
# repointable by the action owner or by anyone who compromises the action repository — the
# tj-actions/changed-files supply-chain pattern. The human-readable version is in a trailing
# comment so Dependabot can still propose upgrades (.github/dependabot.yml).
#
# PERMISSIONS
# -----------
# Every job declares least-privilege `permissions:`. The old workflows declared none and so
# inherited the repository-default GITHUB_TOKEN scope, which on older repository settings is
# read/write on all scopes.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Top-level default: read-only. Jobs escalate individually, and none of them needs to.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # Repository-wide gates. These need no SDK and are expected to be GREEN today.
  # ===========================================================================

  version-policy:
    name: Version policy (C-15)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need history so the monotonicity gate can resolve the merge base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Determine baseline ref
        id: baseline
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce VERSIONING.md
        run: |
          python .github/scripts/check_versions.py --baseline "${{ steps.baseline.outputs.ref }}"

  icon-corpus-parity:
    name: Icon corpus parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The two corpora are currently byte-for-byte identical — the "silent drift" asserted
      # by two auditors is FALSE and was struck (Appendix F §2.4). What is missing is any
      # mechanism preventing FUTURE divergence, which would break the frozen cross-platform
      # iconset contract silently. This job is that mechanism.
      - name: Assert the two icon corpora are identical
        run: python .github/scripts/check_icon_corpora.py --report

  clean-clone-build:
    name: Clean-clone build (C-29)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # C-29: three load-bearing source files (AutoSymbology.java x2, autoSymbology.ts) were
      # untracked while tracked, modified files imported them. HEAD still built, so the
      # breakage was prospective — the first commit of that work would have broken the branch
      # for everyone. This job makes that class of error impossible to land: it builds from
      # what git actually tracks, with no working-tree residue.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Export a pristine tree from the index
        run: |
          set -euo pipefail
          mkdir -p /tmp/clean
          # `git archive` sees ONLY tracked content. Anything load-bearing but untracked
          # simply will not be there, and the steps below will fail.
          git archive HEAD | tar -x -C /tmp/clean
          echo "Tracked files exported: $(find /tmp/clean -type f | wc -l)"

      - name: Assert every TypeScript import resolves to a tracked file
        working-directory: /tmp/clean/CloudTAK/plugin
        run: |
          set -euo pipefail
          missing=0
          # Walk every relative import in the tracked TS sources and confirm the target is
          # present in the pristine export.
          while IFS= read -r line; do
            src="${line%%:*}"
            spec="$(printf '%s' "$line" | sed -n "s/.*from *['\"]\(\.[^'\"]*\)['\"].*/\1/p")"
            [ -z "$spec" ] && continue
            dir="$(dirname "$src")"
            ok=0
            for ext in "" ".ts" ".tsx" ".js" ".vue" "/index.ts"; do
              [ -f "$dir/$spec$ext" ] && ok=1 && break
            done
            if [ "$ok" -eq 0 ]; then
              echo "UNRESOLVED IMPORT: $src -> $spec"
              missing=$((missing+1))
            fi
          done < <(grep -rn "from *['\"]\." --include='*.ts' --include='*.vue' . || true)
          if [ "$missing" -gt 0 ]; then
            echo
            echo "$missing import(s) do not resolve in a clean clone."
            echo "This is C-29: a tracked file importing an UNTRACKED one. Run 'git add' on the"
            echo "missing sources in the same commit as their callers."
            exit 1
          fi
          echo "All relative TypeScript imports resolve against tracked content."

      - name: Assert every Java import of a first-party class resolves to a tracked file
        run: |
          set -euo pipefail
          missing=0
          for tree in ATAK5.6 ATAK5.7; do
            src="/tmp/clean/$tree/app/src/main/java"
            [ -d "$src" ] || continue
            while IFS= read -r fq; do
              # R and BuildConfig are generated by AAPT/Gradle at build time and are never
              # tracked sources — checking for them here is a false positive that fails a
              # clean clone that is in fact complete. Skip the generated classes.
              case "$fq" in
                *.R|*.BuildConfig) continue ;;
              esac
              path="$src/$(printf '%s' "$fq" | tr '.' '/').java"
              if [ ! -f "$path" ]; then
                echo "UNRESOLVED IMPORT ($tree): $fq"
                missing=$((missing+1))
              fi
            done < <(grep -rhoP '^import \Kcom\.atakmap\.android\.featurelink\.[A-Za-z0-9_.]+(?=;)' "$src" | sort -u)
          done
          if [ "$missing" -gt 0 ]; then
            echo
            echo "$missing first-party Java import(s) do not resolve in a clean clone (C-29)."
            exit 1
          fi
          echo "All first-party Java imports resolve against tracked content."

      - name: Assert Python entry points import cleanly from the pristine tree
        working-directory: /tmp/clean
        run: python -m py_compile Infra-TAK/featurelink_displayconfig.py

  # ===========================================================================
  # Node components. These CAN be built and tested for real, today.
  # ===========================================================================

  cloudtak:
    name: CloudTAK (typecheck / lint / test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: CloudTAK/plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CloudTAK/plugin/package-lock.json

      # `npm ci` — not `npm install`. It installs exactly the lockfile and fails if
      # package.json and the lockfile disagree. This is the reproducibility half of C-30:
      # CloudTAK/.gitignore previously ignored plugin/package-lock.json, deliberately
      # discarding the lockfile, so with `eslint ^10` / `typescript ^6` / `vue ^3.5` caret
      # ranges any two installs could resolve differently.
      - name: Assert the lockfile is committed (C-30)
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::CloudTAK/plugin/package-lock.json is not present in the checkout."
            echo "C-30: the lockfile is what makes 'npm ci' reproducible and is the input to"
            echo "the CycloneDX SBOM. Remove the ignore rule and commit it."
            exit 1
          fi

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  takportal:
    name: TAK Portal (lint / test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: TAKPortal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::TAKPortal/package-lock.json is absent; falling back to 'npm install'."
            echo "::warning::Commit the lockfile so this component is reproducible (C-30)."
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # install.sh and uninstall.sh are how this component is deployed, with root-adjacent
      # effects. A syntax error in them is a production outage, and they are never compiled.
      - name: Shell script syntax check
        run: |
          set -euo pipefail
          for f in install.sh uninstall.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" && echo "OK  $f"
          done

      # A CRLF shebang line makes a script fail on Linux with `bad interpreter: /bin/bash^M`.
      # .gitattributes pins *.sh to LF; this asserts the pin actually held.
      - name: Assert shell scripts are LF (see .gitattributes)
        run: |
          set -euo pipefail
          bad=0
          for f in install.sh uninstall.sh; do
            [ -f "$f" ] || continue
            if head -c 2000 "$f" | grep -q $'\r'; then
              echo "::error::$f contains CR characters. It will not execute on Linux."
              bad=1
            fi
          done
          exit $bad

  infratak:
    name: Infra-TAK (lint / test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Infra-TAK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # Pinned exactly: an unpinned linter is a build that can start failing without a
          # commit, and an unpinned install is an unattested dependency (C-35 / NIST SSDF).
          pip install "ruff==0.14.2" "pytest==8.4.2" "bandit==1.9.2"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ruff
        run: ruff check .

      - name: Bandit (Python static security analysis)
        # Infra-TAK is root-privileged at install time and carries the confirmed XSS at
        # featurelink_displayconfig.py:248. It gets a security linter, not just a style one.
        run: bandit -r . -ll

      - name: Tests
        run: |
          if compgen -G "test_*.py" > /dev/null || compgen -G "tests/**" > /dev/null; then
            pytest -q
          else
            echo "::warning::Infra-TAK has no test files yet (C-14). Skipping pytest."
          fi

      - name: Shell script syntax + LF check
        run: |
          set -euo pipefail
          bad=0
          for f in install.sh uninstall.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" && echo "OK  syntax $f"
            if head -c 2000 "$f" | grep -q $'\r'; then
              echo "::error::$f contains CR characters. It will not execute on Linux."
              bad=1
            fi
          done
          exit $bad

  # ===========================================================================
  # ATAK and WinTAK builds are NOT run here.
  #
  # Compiling them requires the licensed ATAK CIV and WinTAK SDKs (main.jar, TAK.Engine
  # and friends). Those assemblies are not redistributable and cannot live in a public
  # repository, so a public runner can never build these targets. Rather than keep four
  # jobs that can only ever fail here — and a required aggregate they permanently block —
  # the ATAK and WinTAK build jobs have been removed from public CI.
  #
  # This does NOT weaken supply-chain coverage of those components: the source-scan SBOMs
  # for atak5.6/5.7 and wintak5.6/5.7 still run in .github/workflows/sbom.yml, and
  # release.yml still enforces the version policy and attests provenance before publishing.
  # A private mirror that holds the SDK secrets can reintroduce compiled build jobs there.
  # ===========================================================================
  # ===========================================================================
  # Aggregate gate. Branch protection should require THIS check, so that adding a new
  # component job automatically becomes required without editing branch settings.
  # ===========================================================================

  ci-required:
    name: CI required checks
    if: always()
    needs:
      - version-policy
      - icon-corpus-parity
      - clean-clone-build
      - cloudtak
      - takportal
      - infratak
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail if any required job did not succeed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if printf '%s' "$results" | grep -qE '"result" *: *"(failure|cancelled)"'; then
            echo "::error::At least one required CI job failed."
            exit 1
          fi
          echo "All required CI jobs succeeded."

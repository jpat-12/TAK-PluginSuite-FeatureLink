name: Build FeatureLink APK

on:
  push:
    branches: ['**']        # build every branch on push
  pull_request:
  workflow_dispatch:        # manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Android SDK ─────────────────────────────────────────────────────
      - name: Install Android compile target
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;34.0.0" 2>/dev/null | tail -1

      # ── 4. TAK build plugin ────────────────────────────────────────────────
      - name: Verify TAK dev plugin present
        run: |
          if [ ! -f buildtools/atak-gradle-takdev.jar ]; then
            echo "ERROR: buildtools/atak-gradle-takdev.jar is missing."
            exit 1
          fi
          echo "atak-gradle-takdev.jar found ($(wc -c < buildtools/atak-gradle-takdev.jar) bytes)"

      # ── 5. Download main.jar from the sdk-artifacts release ────────────────
      # Upload main.jar once from your local SDK:
      #   gh release create sdk-artifacts --title "ATAK SDK artifacts" --notes "" \
      #     "C:\...\ATAK-CIV-5.6.0-SDK\main.jar"
      # The workflow downloads it from that release every build.
      - name: Download ATAK main.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SDK_DIR="$GITHUB_WORKSPACE/sdk-artifacts"
          mkdir -p "$SDK_DIR"
          gh release download sdk-artifacts \
            --pattern "main.jar" \
            --dir "$SDK_DIR" \
            --repo "${{ github.repository }}"
          echo "ATAK_SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "main.jar downloaded ($(wc -c < "$SDK_DIR/main.jar") bytes)"

      # ── 6. local.properties ────────────────────────────────────────────────
      - name: Write local.properties
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          takdev.plugin=$GITHUB_WORKSPACE/buildtools/atak-gradle-takdev.jar
          sdk.path=$ATAK_SDK_DIR
          EOF

      # ── 8. Build ───────────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build CIV debug APK
        run: ./gradlew assembleCivDebug --no-daemon --stacktrace

      # ── 9. Upload artifact ─────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeatureLink-civ-debug-${{ github.run_number }}
          path: app/build/outputs/apk/civ/debug/*.apk
          retention-days: 30

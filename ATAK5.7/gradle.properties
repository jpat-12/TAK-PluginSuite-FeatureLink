# Committed (see .gitignore's exception for this one file) so every build environment gets
# enough JVM heap for R8 — a civRelease build's minifyCivReleaseWithR8 step previously hit
# java.lang.OutOfMemoryError: Java heap space on both GitHub Actions and the TAK Product
# Center submission pipeline's default heap.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# FeatureLink Suite — CycloneDX SBOM generation, one per component.
#
# Closes the SBOM half of C-35 and the "SBOM / supply-chain attestation" coverage gap
# recorded in checklist Appendix F §5.
#
# The gap as filed: individual pieces were noted by individual auditors — the unpinned
# atak-gradle-takdev.jar executed on the Gradle classpath, the gitignored
# package-lock.json, the unverified `git pull` self-updaters — but nobody stated the
# aggregate: there is no SBOM, no dependency pinning by digest, no provenance attestation
# and no signed release artifact for ANY of the seven components. Under EO 14028 and NIST
# SSDF self-attestation that is a submission blocker on its own, independent of whether any
# individual dependency turns out to be vulnerable.
#
# SBOMs are produced on every push (so they are always current and always diffable) and are
# attached to every release by .github/workflows/release.yml.
#
# Tool versions are pinned exactly. An SBOM generated by a floating tool version is not
# reproducible, which defeats a large part of the point of having one.

name: SBOM

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    # Called by release.yml so that a release publishes exactly the SBOMs CI produced.

permissions:
  contents: read

jobs:

  node-sbom:
    name: SBOM — ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: cloudtak
            dir: CloudTAK/plugin
          - component: takportal
            dir: TAKPortal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install from the lockfile
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::${{ matrix.component }}: no lockfile — the SBOM will record"
            echo "::warning::whatever npm resolved TODAY, which is not reproducible (C-30)."
            npm install --no-audit --no-fund
          fi

      - name: Generate CycloneDX SBOM
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm@6.0.0 \
            --output-format JSON \
            --output-file "$GITHUB_WORKSPACE/sbom-${{ matrix.component }}.cdx.json" \
            --spec-version 1.6
          echo "--- component count ---"
          python3 -c "import json,sys; d=json.load(open('$GITHUB_WORKSPACE/sbom-${{ matrix.component }}.cdx.json')); print(len(d.get('components',[])), 'components')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.cdx.json
          retention-days: 90

  python-sbom:
    name: SBOM — infratak
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          pip install "cyclonedx-bom==7.3.1"
          if [ -f Infra-TAK/requirements.txt ]; then
            cyclonedx-py requirements Infra-TAK/requirements.txt \
              --output-format JSON --outfile sbom-infratak.cdx.json
          else
            echo "::warning::Infra-TAK has no requirements.txt — its dependency set is"
            echo "::warning::undeclared, so the SBOM records only the component itself."
            echo "::warning::Declare Flask and every other import in a pinned requirements.txt."
            cyclonedx-py environment --output-format JSON --outfile sbom-infratak.cdx.json
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-infratak
          path: sbom-infratak.cdx.json
          retention-days: 90

  # ATAK and WinTAK SBOMs need the SDKs to resolve their full dependency graph. Rather than
  # emit nothing, syft scans the source tree and lockfile-equivalents it can read without
  # compiling, so the SBOM exists and is honest about its own completeness.
  jvm-dotnet-sbom:
    name: SBOM — ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: atak5.6
            dir: ATAK5.6
          - component: atak5.7
            dir: ATAK5.7
          - component: wintak5.6
            dir: WinTAK5.6
          - component: wintak5.7
            dir: WinTAK5.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate CycloneDX SBOM (source scan)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ matrix.dir }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.component }}.cdx.json
          output-file: sbom-${{ matrix.component }}.cdx.json

      - name: Record SBOM completeness caveat
        run: |
          cat <<'MSG'
          NOTE ON COMPLETENESS
          --------------------
          This SBOM is produced by a SOURCE scan, without the ATAK/WinTAK SDK on the
          classpath. It therefore captures declared dependencies (packages.config,
          build.gradle) but NOT the transitive graph a real resolve would produce, and NOT
          the SDK assemblies themselves — whose redistribution terms are in any case
          undocumented (see THIRD-PARTY-NOTICES.md, "Unresolved").

          A complete SBOM for these two components requires the SDK secrets described in
          .github/workflows/ci.yml. Until those are wired up, treat this artifact as a
          partial inventory and say so in any attestation that references it.
          MSG

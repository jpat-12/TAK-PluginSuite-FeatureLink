////////////////////////////////////////////////////////////////////////////////
//
// PLUGIN_VERSION is the common version name when describing the plugin.
// ATAK_VERSION   is for the version of ATAK this plugin should be compatible
//                with some examples include 3.11.0, 3.11.0.civ 3.11.1.fvey
//
////////////////////////////////////////////////////////////////////////////////

buildscript {
    // MUST equal the contents of the repository-root VERSION file (VERSIONING.md §1). Was
    // "2.7.24": a MINOR bump that carried the old PATCH across, which §1.1 prohibits outright.
    ext.PLUGIN_VERSION = "2.7.0"
    ext.ATAK_VERSION = '5.7.0'

    def takdevVersion = '3.+'

    def getValueFromPropertiesFile = { propFile, key ->
        if(!propFile.isFile() || !propFile.canRead())
            return null
        def prop = new Properties()
        def reader = propFile.newReader()
        try {
            prop.load(reader)
        } finally {
            reader.close()
        }
        return prop.get(key)
    }

    def getProperty = { name, defValue ->
        def prop = project.properties[name] ?:
                getValueFromPropertiesFile(project.rootProject.file('local.properties'), name)
        return (null == prop) ? defValue : prop
    }

    def urlKey = 'takrepo.url'

    ext.isDevKitEnabled = { ->
        return getProperty(urlKey, null) != null
    }

    ext.takrepoUrl = getProperty(urlKey, 'https://localhost/')
    ext.takrepoUser = getProperty('takrepo.user', 'invalid')
    ext.takrepoPassword = getProperty('takrepo.password', 'invalid')
    ext.takdevPlugin = getProperty('takdev.plugin', "${rootDir}/buildtools/atak-gradle-takdev.jar")
    ext.atakSdkPath  = getProperty('atak.sdk.path', null)

    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven {
            url = "https://jitpack.io"
        }
        maven {
            url = takrepoUrl
            credentials {
                username = takrepoUser
                password = takrepoPassword
            }
        }
    }
    dependencies {
        if (isDevKitEnabled()) {
            classpath "com.atakmap.gradle:atak-gradle-takdev:${takdevVersion}"
        } else {
            classpath files(takdevPlugin)
        }
    }
}

plugins {
    id("com.android.application")
}
apply {
    plugin("atak-takdev-plugin")
}

allprojects {
    repositories {
        mavenCentral()
        google()
        mavenLocal()
        maven {
            url = "https://jitpack.io"
        }
    }
}

def supportedFlavors =
[
    [ name : 'civ', default: true ],
    [ name : 'mil' ],
    [ name : 'gov' ],
]

android {
    compileSdk 36
    namespace = 'com.atakmap.android.featurelink.plugin'

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    bundle {
        storeArchive {
            enable = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        debug {
            storeFile file("${projectDir}/featurelink.keystore")
            storePassword "tnttnt"
            keyAlias "wintec_mapping"
            keyPassword "tnttnt"
        }
        release {
            storeFile file("${projectDir}/featurelink.keystore")
            storePassword "tnttnt"
            keyAlias "wintec_mapping"
            keyPassword "tnttnt"
        }
    }

    buildTypes {
        debug {
            debuggable true
            matchingFallbacks = ['sdk']
        }
        release {
            minifyEnabled true
            proguardFiles 'proguard-gradle.txt', 'proguard-gradle-repackage.txt'
            signingConfig = signingConfigs.release
            matchingFallbacks = ['odk']
        }
    }

    flavorDimensions "application"

    productFlavors {
        supportedFlavors.each { flav ->
            "${flav.name}" {
                getIsDefault().set(flav.default)
                dimension "application"

                if (!flav.name.equals("civ") && !flav.name.equals("mil")) {
                    applicationIdSuffix = ".${flav.name}"
                }
                matchingFallbacks = ['civ']

                def pluginApiFlavor = flav.name.equals('gov') ? 'CIV' : "${flav.name.toUpperCase()}"
                manifestPlaceholders = [atakApiVersion: "com.atakmap.app@" + ATAK_VERSION + ".${pluginApiFlavor}"]
            }
        }
        applicationVariants.all { variant ->
            variant.resValue "string", "versionName", variant.versionName
            buildConfigField 'String', 'ATAK_PACKAGE_NAME', '"com.atakmap.app.civ"'
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST']
        }
        jniLibs.useLegacyPackaging = true
    }

    sourceSets {
        gov.java.srcDirs 'src/gov/java'
        gov.assets.srcDir 'src/gov/assets'
        gov.res.srcDir 'src/gov/res'

        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')

        // Applies to the .aab bundle output too (Gradle appends its own flavor/buildType
        // suffix), so e.g. app-civ-release.aab becomes
        // ATAK-Plugin-FeatureLink-2.6.18-ATAK-5.6-civ-release.aab — matching the .apk naming
        // below instead of the generic default.
        main {
            setProperty("archivesBaseName", "ATAK-Plugin-FeatureLink-" + PLUGIN_VERSION + "-ATAK-" + atakMajorMinor())
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        // Derived, never hand-edited (VERSIONING.md §3). The literal 5 sat here across nine
        // releases, freezing Android's only upgrade discriminator so no fielded device ever
        // upgraded in place. The formula is a pure function of tracked source, so it is
        // reproducible and strictly monotonic by construction.
        // The ordinal is passed literally rather than parsed out of ATAK_VERSION so that the
        // two targets are visibly different at this line, which is also what
        // .github/scripts/check_versions.py asserts.
        versionCode derivedVersionCode(7)
        // Build metadata identifies which ATAK target this APK is, which the filename alone
        // could not do once installed (VERSIONING.md §2).
        versionName "${PLUGIN_VERSION}+atak5.7"

        def runTasks = gradle.startParameter.taskNames
        if (runTasks.toString().contains('bundle')) {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        } else {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86"
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            // e.g. ATAK-Plugin-FeatureLink-2.6.18-ATAK-5.6-release — to match the naming
            // TAK Product Center's submission pipeline expects for release artifacts.
            outputFileName = "ATAK-Plugin-FeatureLink-${PLUGIN_VERSION}-ATAK-${atakMajorMinor()}-${variant.buildType.name}.apk"
        }
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

afterEvaluate {
    // Empty ProGuard mapping fallback so release ProGuard doesn't abort if the SDK mapping
    // path was not provided by the takdev plugin — proguard-gradle.txt's -applymapping
    // <atak.proguard.mapping> needs this system property set to *something* resolvable.
    if (!System.properties.containsKey('atak.proguard.mapping')) {
        def emptyMapping = new File("${buildDir}/takdev-mapping-fallback.txt")
        emptyMapping.parentFile.mkdirs()
        if (!emptyMapping.exists()) emptyMapping.text = ''
        System.setProperty('atak.proguard.mapping', emptyMapping.absolutePath)
    }

    project.file('proguard-gradle-repackage.txt').text = "-repackageclasses atakplugin.${rootProject.getName()}"

    try {
        tasks.named("compile" + getCommandFlavor() + "ReleaseKotlin") {
            kotlinOptions {
                freeCompilerArgs += "-Xsam-conversions=class"
            }
        }
    } catch (Exception ignored) { }
}

// ATAK_VERSION trimmed to major.minor, e.g. "5.6.0" -> "5.6".
def atakMajorMinor() {
    return ATAK_VERSION.tokenize('.').take(2).join('.')
}

/**
 * versionCode = MAJOR*1_000_000 + MINOR*10_000 + PATCH*100 + ATAK target ordinal
 * (VERSIONING.md §3). Reversible: given a code off a field device you can recover both the
 * suite version and which ATAK target it was built for. Suite 2.7.0 gives 2070006 for ATAK 5.6
 * and 2070007 for 5.7.
 */
def derivedVersionCode(int ordinal) {
    def v = PLUGIN_VERSION.tokenize('+')[0].tokenize('.')
    if (v.size() < 3)
        throw new GradleException("PLUGIN_VERSION '${PLUGIN_VERSION}' is not MAJOR.MINOR.PATCH")
    // Guard against the ordinal drifting away from the SDK this tree actually builds against.
    def fromSdk = ATAK_VERSION.tokenize('.')[1] as int
    if (ordinal != fromSdk)
        throw new GradleException("versionCode ordinal ${ordinal} does not match ATAK_VERSION "
                + "'${ATAK_VERSION}' (expected ${fromSdk})")
    return (v[0] as int) * 1000000 + (v[1] as int) * 10000 + (v[2] as int) * 100 + ordinal
}

def getCommandFlavor() {
    String tskReqStr = getGradle().getStartParameter().getTaskRequests().toString()

    java.util.regex.Pattern pattern
    if (tskReqStr.contains("assemble"))
        pattern = java.util.regex.Pattern.compile("assemble(\\w+)(Release|Debug)")
    else if (tskReqStr.contains("install"))
        pattern = java.util.regex.Pattern.compile("install(\\w+)(Release|Debug)")
    else
        pattern = java.util.regex.Pattern.compile("generate(\\w+)(Release|Debug)")

    java.util.regex.Matcher matcher = pattern.matcher(tskReqStr)

    if (matcher.find()) {
        return matcher.group(1)
    } else {
        return "Civ"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')
    implementation 'com.google.zxing:core:3.5.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"

    if (atakSdkPath) {
        compileOnly files("${atakSdkPath}/main.jar")
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.core' && !details.requested.name.contains('core-viewtree')) {
            details.useVersion "1.17.0"
        }
        if (details.requested.group == 'androidx.lifecycle') {
            details.useVersion "2.9.4"
        }
        if (details.requested.group == 'androidx.fragment') {
            details.useVersion "1.8.9"
        }
        if (details.requested.group == 'com.squareup.okhttp3') {
            details.useVersion "4.11.0"
        }
        if (details.requested.group == 'com.squareup.okio') {
            details.useVersion "3.2.0"
        }
    }
}

configurations.implementation {
    exclude group: 'androidx.core', module: 'core-ktx'
    exclude group: 'androidx.core', module: 'core'
    exclude group: 'androidx.fragment', module: 'fragment'
    exclude group: 'androidx.lifecycle', module: 'lifecycle'
    exclude group: 'androidx.lifecycle', module: 'lifecycle-process'
    exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    exclude group: 'com.squareup.okio', module: 'okio'
}

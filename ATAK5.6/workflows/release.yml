name: Release FeatureLink APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0, 1.1)'
        required: true
        default: '1.0'
      release_notes:
        description: 'Release notes'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Android SDK ─────────────────────────────────────────────────────
      - name: Install Android compile target
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;34.0.0" 2>/dev/null | tail -1

      # ── 4. TAK build plugin ────────────────────────────────────────────────
      - name: Verify TAK dev plugin present
        run: |
          if [ ! -f buildtools/atak-gradle-takdev.jar ]; then
            echo "ERROR: buildtools/atak-gradle-takdev.jar is missing."
            exit 1
          fi

      # ── 5. Download main.jar ───────────────────────────────────────────────
      - name: Download ATAK main.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SDK_DIR="$GITHUB_WORKSPACE/sdk-artifacts"
          mkdir -p "$SDK_DIR"
          gh release download sdk-artifacts \
            --pattern "main.jar" \
            --dir "$SDK_DIR" \
            --repo "${{ github.repository }}"
          echo "ATAK_SDK_DIR=$SDK_DIR" >> $GITHUB_ENV

      # ── 6. local.properties ────────────────────────────────────────────────
      - name: Write local.properties
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          takdev.plugin=$GITHUB_WORKSPACE/buildtools/atak-gradle-takdev.jar
          sdk.path=$ATAK_SDK_DIR
          EOF

      # ── 8. Stamp version into build.gradle ────────────────────────────────
      - name: Set version
        run: |
          sed -i "s/ext.PLUGIN_VERSION = .*/ext.PLUGIN_VERSION = \"${{ github.event.inputs.version }}\"/" app/build.gradle

      # ── 9. Build ───────────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build CIV release APK
        run: ./gradlew assembleCivRelease --no-daemon --stacktrace

      # ── 10. Publish GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/civ/release -name "*.apk" | head -1)
          NOTES="${{ github.event.inputs.release_notes }}"
          gh release create "v${{ github.event.inputs.version }}" \
            --title "FeatureLink v${{ github.event.inputs.version }}" \
            --notes "${NOTES:-Release v${{ github.event.inputs.version }}}" \
            "$APK"
